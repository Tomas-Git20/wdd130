<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Tomás Lo Giudice">
</head>
<body>
    <header>
        <img src="images/basic-logo.png" alt="HTML basic structure example" width="128" height="128">

    <nav>
        <ul>
            <li><a href="https://es.wikipedia.org/wiki/Wikipedia:Portada"></a></li>
            <li><a href="https://github.com/"></a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>The first Lorem</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Error, fugiat!</p>
        </section>
        <section>
            <h2>The second Lorem</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, maiores!</p>
        </section>
    </main>
    <aside>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/buenos-aires-argentina/800x500/buenos-airies-argentina-temple-1009069-wallpaper.jpg" alt="Buenos Aires Argentina Temple" width="200">
    </aside>
    <footer>
        <p>Tomás Lo Giudice</p>
    </footer>

</html>
